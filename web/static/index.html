<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LihuQuantify · 量化监控看板</title>
    <!-- 问题2（第九轮）：echarts 只用本地 vendor（CDN+本地双加载会互相覆盖且
         内网环境 CDN 不可达时阻塞渲染；vendor 版本 5.x 约 1MB 已核对完整） -->
    <style>
        /* ============ 设计系统 ============ */
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #111827;
            --bg-hover: #1f2937;
            --bg-input: #1a2235;
            --border: #1f2a3d;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Noto Sans SC", sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============ 布局 ============ */
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: var(--transition);
        }
        .sidebar-logo {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .sidebar-logo span {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }
        .nav-item {
            padding: 12px 24px;
            margin: 4px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            transition: var(--transition);
            font-size: 14px;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            font-weight: 600;
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-badge {
            margin-left: auto;
            background: var(--accent);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }
        .main {
            margin-left: 220px;
            flex: 1;
            padding: 32px;
            max-width: 1400px;
        }

        /* ============ 页面切换动画 ============ */
        .page { display: none; animation: fadeIn 0.35s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ 卡片 ============ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover { border-color: #2d3f55; }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* ============ 指标网格 ============ */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .metric-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .metric-card:hover::before { opacity: 1; }
        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .metric-value.positive { color: var(--green); }
        .metric-value.negative { color: var(--red); }
        .metric-value.neutral { color: var(--text-primary); }
        .metric-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        /* 评审进度条（100 笔 live 验收卡） */
        .progress-wrap { height: 6px; background: var(--bg-alt, #eceff3); border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent, #4f8cff); border-radius: 3px; transition: width .4s; }
        .progress-fill.warn { background: #e6a23c; }
        .progress-fill.ok { background: var(--green, #16a34a); }

        /* ============ 状态徽章 ============ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .badge-uptrend { background: rgba(16,185,129,0.15); color: var(--green); }
        .badge-sideways { background: rgba(245,158,11,0.15); color: var(--amber); }
        .badge-downtrend { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 热力图维度切换按钮 */
        .hm-dim-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .hm-dim-btn:hover { border-color: var(--accent); color: var(--accent); }
        .hm-dim-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ============ 设置页（第十轮需求1/2/3） ============ */
        .set-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .set-row:last-child { border-bottom: none; }
        .set-main { flex: 1; min-width: 0; }
        .set-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .set-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .set-rec {
            display: inline-block;
            font-size: 12px;
            margin-top: 6px;
            padding: 3px 10px;
            border-radius: 12px;
        }
        .set-badge-ok { color: var(--green); background: rgba(16,185,129,0.12); }
        .set-badge-warn { color: var(--amber); background: rgba(245,158,11,0.12); }
        .set-badge-lock { color: var(--text-muted); background: rgba(156,163,175,0.12); }
        .set-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            padding: 8px 12px;
            margin-top: 8px;
            outline: none;
        }
        .set-input:focus { border-color: var(--accent); }
        .set-toggle {
            width: 40px; height: 22px;
            appearance: none;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-top: 3px;
        }
        .set-toggle::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.2s;
        }
        .set-toggle:checked { background: var(--accent); border-color: var(--accent); }
        .set-toggle:checked::after { left: 20px; background: #fff; }

        /* ============ 表格 ============ */
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        tr:hover td { background: var(--bg-hover); }
        td .pos { color: var(--green); }
        td .neg { color: var(--red); }
        /* 第六轮清单2/3：A股口径红涨绿跌（涨=red，跌=green），用于价格/盈亏类数值 */
        .up { color: var(--red); font-weight: 600; }
        .dn { color: var(--green); font-weight: 600; }
        .metric-value.up { color: var(--red); }
        .metric-value.dn { color: var(--green); }

        /* ============ 图表容器 ============ */
        .chart-box {
            width: 100%;
            height: 320px;
            margin-top: 8px;
        }

        /* ============ 报告页 ============ */
        .report-list { display: grid; gap: 12px; }
        .report-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .report-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }
        .report-date { font-weight: 600; font-size: 15px; }
        .report-meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
        .report-view {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-top: 20px;
            line-height: 1.8;
            font-size: 14px;
        }
        .report-view h1, .report-view h2, .report-view h3 { margin: 20px 0 12px; }
        .report-view h1 { font-size: 20px; color: var(--text-primary); }
        .report-view h2 { font-size: 16px; color: var(--text-primary); }
        /* 需求4（第十轮）：marked 表格样式——边框/斑马纹/表头底色/溢出滚动 */
        .report-view table {
            display: block;
            width: 100%;
            font-size: 13px;
            margin: 12px 0;
            border-collapse: collapse;
            overflow-x: auto;
            white-space: nowrap;
        }
        .report-view th, .report-view td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            text-align: left;
        }
        .report-view thead th { background: var(--bg-hover); color: var(--text-primary); }
        .report-view tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .report-view tbody tr:hover { background: var(--bg-hover); }
        .report-view code {
            background: var(--bg-hover);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .report-view blockquote {
            border-left: 3px solid var(--amber);
            padding-left: 16px;
            color: var(--amber);
            margin: 12px 0;
        }
        .back-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
            margin-bottom: 16px;
        }
        .back-btn:hover { background: var(--bg-card); color: var(--text-primary); }

        /* ============ 加载/空状态 ============ */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
        }
        .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }

        /* ============ 响应式 ============ */
        @media (max-width: 900px) {
            .sidebar { width: 64px; }
            .sidebar-logo h1, .sidebar-logo span { display: none; }
            .nav-item { padding: 12px; justify-content: center; }
            .nav-item span { display: none; }
            .main { margin-left: 64px; padding: 20px; }
            .metric-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ============ 滚动条 ============ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h1>LihuQuantify</h1>
                <span>量化监控看板</span>
            </div>
            <nav>
                <div role="button" tabindex="0" class="nav-item active" onclick="showPage('dashboard', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
                    <span>仪表盘</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('reports', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span>巡检报告</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('backtest', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    <span>回测分析</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('grid', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    <span>网格搜索</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('heatmap', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
                    <span>市场热力图</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('settings', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>系统设置</span>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main">
            <!-- ============ 仪表盘 ============ -->
            <div class="page active" id="page-dashboard">
                <div class="metric-grid" id="metricsGrid">
                    <div class="loading">加载中</div>
                </div>
                <!-- 需求5（第十轮）：今日简报卡片（AI 版优先，失败回退规则版，永不为空） -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--purple)"></span>今日简报</div>
                        <span class="badge" id="aiSummaryDate" style="background:rgba(139,92,246,0.15);color:var(--purple);"></span>
                    </div>
                    <div id="aiSummaryText" class="loading">加载中</div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--accent)"></span>持仓与止损监控</div>
                        <span class="badge badge-sideways" id="marketBadge">-</span>
                    </div>
                    <div class="table-wrap">
                        <table id="positionsTable">
                            <thead><tr><th>代码</th><th>名称</th><th>持股</th><th>成本</th><th>现价</th><th>市值</th><th>浮动盈亏</th><th>盈亏%</th><th>止损线</th><th>状态</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="pendingStops" style="margin-top:12px;"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--green)"></span>近 10 笔交易</div>
                    </div>
                    <div class="table-wrap">
                        <table id="tradesTable">
                            <thead><tr><th>日期</th><th>代码</th><th>方向</th><th>价格</th><th>数量</th><th>盈亏</th><th>原因</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ============ 报告页 ============ -->
            <div class="page" id="page-reports">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--purple)"></span>每日巡检报告</div>
                    </div>
                    <div class="report-list" id="reportList">
                        <div class="loading">加载中</div>
                    </div>
                </div>
                <div id="reportView"></div>
            </div>

            <!-- ============ 回测页 ============ -->
            <div class="page" id="page-backtest">
                <div class="metric-grid" id="backtestMetrics"></div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--cyan)"></span>绩效指标详情</div>
                    </div>
                    <div id="backtestDetail"><div class="loading">加载中</div></div>
                </div>
            </div>

    <script src="/static/vendor/marked.min.js"></script>

    <script>
        // P0-7（第十一轮）：统一 API 鉴权——重写 window.fetch（一处覆盖全部调用点）：
        // ① localStorage 令牌自动为 /api/* 附 Bearer 头；
        // ② 401 → 首次弹令牌输入框，存储后刷新（静态页/静态资源不受影响）。
        (function () {
            const _fetch = window.fetch.bind(window);
            window.fetch = function (url, opts) {
                opts = opts || {};
                const isApi = String(url).indexOf('/api/') === 0;
                const token = localStorage.getItem('lihu_web_token');
                if (isApi && token) {
                    opts.headers = Object.assign({}, opts.headers || {},
                        { 'Authorization': 'Bearer ' + token });
                }
                return _fetch(url, opts).then(res => {
                    if (res.status === 401 && isApi
                            && !localStorage.getItem('lihu_web_token')) {
                        const t = prompt('看板 API 受保护（LIHU_WEB_TOKEN）：请输入访问令牌');
                        if (t) {
                            localStorage.setItem('lihu_web_token', t.trim());
                            location.reload();
                        }
                    }
                    return res;
                });
            };
        })();
    </script>

    <script>
        // ============ 页面切换 ============
        function showPage(name, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');
            el.classList.add('active');
            if (name === 'dashboard') loadDashboard();
            if (name === 'reports') loadReports();
            if (name === 'backtest') loadBacktest();
            if (name === 'grid') loadGrid();
            if (name === 'heatmap') { if (hmChart) hmChart.resize(); loadHeatmap(); }
            if (name === 'settings') loadSettings();
        }

        // ============ 工具 ============
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const fmt = {
            money: v => v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0}),
            // 第六轮：带符号金额（盈亏展示）；A股口径红涨绿跌
            moneySign: v => v == null ? '-' : (v >= 0 ? '+' : '') + '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0}),
            pct: v => v == null ? '-' : (v * 100).toFixed(2) + '%',
            num: v => v == null ? '-' : Number(v).toLocaleString('zh-CN'),
            sign: v => v == null ? '' : v >= 0 ? `+${(v*100).toFixed(2)}%` : `${(v*100).toFixed(2)}%`,
            color: v => v == null ? '' : v >= 0 ? 'positive' : 'negative',
            // A股红涨绿跌 class（零/空 → 中性）
            ud: v => v == null || v === 0 ? 'neutral' : v > 0 ? 'up' : 'dn',
        };

        // ============ 仪表盘 ============
        let _dashTimer = null;

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();
                renderDashboard(data);
            } catch (e) {
                document.getElementById('metricsGrid').innerHTML =
                    '<div class="empty-state">后端未启动<br><small>运行: python -m web.server</small></div>';
            }
        }

        // 修复H.3：仪表盘 60 秒自动刷新（页面隐藏时暂停）
        function startAutoRefresh() {
            if (_dashTimer) return;
            _dashTimer = setInterval(() => {
                if (!document.hidden && document.getElementById('page-dashboard').classList.contains('active')) {
                    loadDashboard();
                }
            }, 60000);
        }
        startAutoRefresh();

        function renderDashboard(data) {
            const m = data.market || {};
            const acc = data.account || {};
            const live = data.live || {};

            // 市场状态徽章
            const badge = document.getElementById('marketBadge');
            const stateMap = { '上涨': 'badge-uptrend', '震荡': 'badge-sideways', '下跌': 'badge-downtrend' };
            badge.className = 'badge ' + (stateMap[m.state] || 'badge-sideways');
            badge.innerHTML = `<span class="badge-dot" style="background:${m.state==='上涨'?'var(--green)':m.state==='下跌'?'var(--red)':'var(--amber)'}"></span>${esc(m.state || '-')} ${m.ret20d != null ? `(${m.ret20d > 0 ? '+' : ''}${m.ret20d}%)` : ''}`;

            // 指标卡片（第六轮清单3：真实监控指标替换回测预测值；
            // 回测绩效移至"回测分析/网格搜索"页）
            const cards = [
                { label: '总资产', value: fmt.money(acc.total_asset), sub: `现金 ${fmt.money(acc.cash)}` },
                { label: '累计收益率', value: live.cumulative_return != null ? fmt.sign(live.cumulative_return) : '—',
                  sub: `初始 ${fmt.money(live.init_capital ?? acc.init_capital)}`, cls: live.cumulative_return != null ? fmt.ud(live.cumulative_return) : '' },
                { label: '今日盈亏', value: live.day_pnl != null ? fmt.moneySign(live.day_pnl) : '—',
                  sub: live.day_pnl != null ? `已实现 ${fmt.moneySign(live.realized_today ?? 0)}` : '待次日对比',
                  cls: live.day_pnl != null ? fmt.ud(live.day_pnl) : '' },
                { label: '浮动盈亏', value: fmt.moneySign(live.floating_pnl ?? 0),
                  sub: `${acc.positions?.length || 0} 只持仓`, cls: fmt.ud(live.floating_pnl ?? 0) },
                { label: '持仓数', value: acc.positions?.length || 0, sub: '当前持仓' },
                { label: '停手票', value: Object.keys(acc.halt_map || {}).length, sub: '连亏3笔停手30天' },
            ];
            // 评审进度卡（live 100 笔验收；统计口径=配对轮次，见 review_progress.py）
            const stageText = s => ({ accumulating: '积累中', ready_checkpoint50: '可预检', ready_review: '可评审' }[s] || s);
            const rv = data.review || {};
            const closed = rv.closed_rounds ?? 0, tgt = rv.target ?? 100;
            const pct = Math.min(100, Math.round(closed / tgt * 100));
            const fillCls = closed >= tgt ? 'ok' : (closed >= 50 ? 'warn' : '');
            cards.push({
                label: '评审进度',
                value: `${closed} / ${tgt} 轮`,
                sub: rv.win_rate != null
                    ? `胜率 ${fmt.pct(rv.win_rate)} · 盈亏比 ${(rv.pl_ratio ?? 0).toFixed(2)} · ${stageText(rv.stage)}`
                    : `尚无平仓轮 · 已实现 ${fmt.moneySign(rv.realized_pnl ?? 0)}`,
                bar: `<div class="progress-wrap"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>`,
            });
            document.getElementById('metricsGrid').innerHTML = cards.map(c => `
                <div class="metric-card">
                    <div class="metric-label">${c.label}</div>
                    <div class="metric-value ${c.cls || 'neutral'}">${c.value}</div>
                    <div class="metric-sub">${c.sub}</div>
                    ${c.bar || ''}
                </div>
            `).join('');

            // 需求5（第十轮）：今日简报——AI 版优先，失败/未配置回退规则版
            // （brief 永不为空；旧数据无 brief → 回退显示 ai_summary）。
            // 纯文本渲染（textContent，不套 markdown 解析，防注入）。
            const aiEl = document.getElementById('aiSummaryText');
            const aiDate = document.getElementById('aiSummaryDate');
            aiEl.classList.remove('loading');
            aiEl.style.cssText = 'font-size:14px;line-height:1.9;color:var(--text-secondary);white-space:pre-wrap;';
            const brief = data.brief || data.ai_summary;
            aiEl.textContent = brief || '暂无（等待首次巡检生成）';
            aiDate.textContent = brief
                ? `交易日 ${data.ai_summary_date || '-'} · ${(data.brief_is_ai || data.ai_summary) ? 'AI 版' : '规则版'}`
                : '';

            // 持仓表格（第六轮清单2：名称/现价/市值/浮盈亏/盈亏%，红涨绿跌）
            const tbody = document.querySelector('#positionsTable tbody');
            const positions = acc.positions || [];
            if (positions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-muted)">空仓</td></tr>';
            } else {
                tbody.innerHTML = positions.map(p => `
                    <tr>
                        <td><strong>${esc(p.ts_code)}</strong></td>
                        <td>${esc(p.name || '-')}</td>
                        <td>${fmt.num(p.volume)}</td>
                        <td>${p.cost?.toFixed(2)}</td>
                        <td>${p.price != null ? p.price.toFixed(2) : '-'}</td>
                        <td>${p.market_value != null ? fmt.money(p.market_value) : '-'}</td>
                        <td class="${fmt.ud(p.float_pnl)}">${p.float_pnl != null ? fmt.moneySign(p.float_pnl) : '-'}</td>
                        <td class="${fmt.ud(p.float_pnl_pct)}">${p.float_pnl_pct != null ? fmt.sign(p.float_pnl_pct) : '-'}</td>
                        <td>${p.stop_price != null ? p.stop_price.toFixed(2) : '-'}</td>
                        <td>${p.triggered ? '<span class="neg">已触发</span>' : '<span class="pos">监控中</span>'}</td>
                    </tr>
                `).join('');
            }

            // 待执行止损
            const pending = data.pending_stops || [];
            document.getElementById('pendingStops').innerHTML = pending.length ? `
                <div style="font-size:12px;color:var(--amber);margin-top:8px;">
                    ⚠️ 待执行止损 ${pending.length} 个：${pending.map(p => `${esc(p.ts_code)}(${esc(p.reason)})`).join(', ')}
                </div>
            ` : '';

            // 交易表格（第六轮清单4：pnl/reason 已有数据；A股口径红涨绿跌）
            const trTbody = document.querySelector('#tradesTable tbody');
            const trades = data.recent_trades || [];
            if (trades.length === 0) {
                trTbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">暂无交易</td></tr>';
            } else {
                trTbody.innerHTML = trades.map(t => `
                    <tr>
                        <td>${esc(String(t.date || '-'))}</td>
                        <td>${esc(t.ts_code)}</td>
                        <td>${t.side === 'buy' ? '<span class="up">买入</span>' : '<span class="dn">卖出</span>'}</td>
                        <td>${t.price?.toFixed(2)}</td>
                        <td>${fmt.num(t.volume)}</td>
                        <td class="${t.pnl != null ? fmt.ud(t.pnl) : ''}">${t.pnl != null ? fmt.moneySign(t.pnl) : '-'}</td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.reason || '')}">${esc(t.reason || '-')}</td>
                    </tr>
                `).join('');
            }
        }

        // ============ 报告页 ============
        async function loadReports() {
            try {
                const res = await fetch('/api/reports');
                const data = await res.json();
                renderReports(data.reports || []);
            } catch (e) {
                document.getElementById('reportList').innerHTML =
                    '<div class="empty-state">后端未启动</div>';
            }
        }

        function renderReports(reports) {
            const el = document.getElementById('reportList');
            if (reports.length === 0) {
                el.innerHTML = '<div class="empty-state">暂无报告<br><small>先运行 python run_scheduler.py --run-now</small></div>';
                return;
            }
            el.innerHTML = reports.map(r => `
                <div class="report-item" onclick="loadReport('${r.name}')">
                    <div>
                        <div class="report-date">${r.date}</div>
                        <div class="report-meta">${r.title}</div>
                    </div>
                    <div style="color:var(--text-muted);font-size:12px">${(r.size / 1024).toFixed(1)} KB</div>
                </div>
            `).join('');
        }

        async function loadReport(name) {
            const view = document.getElementById('reportView');
            view.innerHTML = '<div class="loading">加载中</div>';
            try {
                const res = await fetch(`/api/reports/${name}`);
                const data = await res.json();
                view.innerHTML = `
                    <button class="back-btn" onclick="document.getElementById('reportView').innerHTML=''">← 返回列表</button>
                    <div class="report-view">${mdToHtml(data.content)}</div>
                `;
                view.scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                view.innerHTML = '<div class="empty-state">报告加载失败</div>';
            }
        }

        // 需求4（第十轮）：marked 渲染（GFM 表格/任务列表）；渲染前整体转义防注入。
        // marked 缺失（vendor 加载失败）→ 纯文本 <pre> 兜底，绝不输出未转义 HTML。
        function mdToHtml(md) {
            const safe = String(md ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            if (typeof marked !== 'undefined' && marked.parse) {
                try { return marked.parse(safe, { gfm: true, breaks: true, silent: true }); }
                catch (e) { /* 落入兜底 */ }
            }
            return '<pre style="white-space:pre-wrap;font-family:inherit;">' + safe + '</pre>';
        }

        // ============ 回测页（修复C：权益曲线 ECharts + 当前配置口径） ============
        let _equityChart = null;

        async function loadBacktest() {
            const el = document.getElementById('backtestMetrics');
            const detail = document.getElementById('backtestDetail');
            el.innerHTML = '<div class="loading">加载中</div>';
            detail.innerHTML = '';
            try {
                const res = await fetch('/api/equity');
                if (res.status === 404) {
                    el.innerHTML = '<div class="empty-state">暂无回测结果<br><small>先运行 python run_full_backtest.py</small></div>';
                    return;
                }
                const data = await res.json();
                renderEquityChart(data);
            } catch (e) {
                el.innerHTML = '<div class="empty-state">后端未启动</div>';
            }
        }

        function renderEquityChart(data) {
            const curve = data.equity_curve || [];
            const m = data.metrics || {};
            const dd = data.max_drawdown_range || {};
            const pool = data.pool_info || {};

            // 指标卡片（当前配置口径；含幸存者偏差提示）
            const cards = [
                { label: '总收益', value: fmt.sign(m.total_return), sub: '含幸存者偏差（乐观口径）', cls: fmt.color(m.total_return) },
                { label: '年化收益', value: fmt.pct(m.annual_return), sub: '同上', cls: fmt.color(m.annual_return) },
                { label: '最大回撤', value: fmt.pct(m.max_drawdown), sub: `${dd.start || '-'} ~ ${dd.end || '-'}`, cls: 'negative' },
                { label: '卡玛比率', value: (m.calmar ?? '-').toFixed ? m.calmar.toFixed(2) : '-', sub: '收益/回撤', cls: fmt.color(m.calmar) },
                { label: '胜率', value: fmt.pct(m.win_rate), sub: `${m.total_trades ?? '-'} 轮` },
                { label: '盈亏比', value: (m.profit_loss_ratio ?? 0).toFixed ? m.profit_loss_ratio.toFixed(2) : '-', sub: m.profit_loss_ratio >= 1 ? '≥1 达标' : '<1 未达标' },
            ];
            document.getElementById('backtestMetrics').innerHTML = cards.map(c => `
                <div class="metric-card">
                    <div class="metric-label">${c.label}</div>
                    <div class="metric-value ${c.cls || 'neutral'}">${c.value}</div>
                    <div class="metric-sub">${c.sub}</div>
                </div>
            `).join('');

            // 回测元信息
            const detail = document.getElementById('backtestDetail');
            detail.innerHTML = `
                <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--text-muted);margin-bottom:16px">
                    <span>生成：${esc(data.generated_at || '-')}</span>
                    <span>配置：${esc(data.config_hash || '-')}</span>
                    <span>市场过滤：${esc(data.market_filter_mode || '-')}</span>
                    <span>池：${esc(pool.type || '-')}（${pool.n_with_data ?? '-'}只×${pool.years ?? '-'}年，截至 ${esc(pool.end_date || '-')}）</span>
                </div>
                <blockquote style="border-left:3px solid var(--amber);padding-left:12px;color:var(--amber);font-size:12px;margin:0 0 16px">
                    ⚠️ 口径提示：池按当前上市股票构建（幸存者偏差，收益系统性偏高）；
                    已含连亏3笔停手 + 板块≤40% + T+1 + 三档止损铁律。
                </blockquote>
                <div id="equityChart" style="width:100%;height:380px"></div>
            `;

            // ECharts 权益曲线（修复C.4）+ 最大回撤区间阴影
            const chartDom = document.getElementById('equityChart');
            if (!chartDom || typeof echarts === 'undefined') return;
            if (_equityChart) _equityChart.dispose();
            _equityChart = echarts.init(chartDom);
            const dates = curve.map(p => p.date);
            const values = curve.map(p => p.equity);
            const markArea = dd.start && dd.end ? [{
                silent: true,
                itemStyle: { color: 'rgba(239,68,68,0.08)' },
                data: [[{ xAxis: dd.start }, { xAxis: dd.end }]],
                label: { show: true, position: 'insideTop', color: '#ef4444', fontSize: 11,
                         formatter: `最大回撤 ${(dd.depth * 100).toFixed(1)}%` },
            }] : [];
            _equityChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#111827',
                    borderColor: '#1f2a3d',
                    textStyle: { color: '#e5e7eb', fontSize: 12 },
                    valueFormatter: v => '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0}),
                },
                grid: { left: 70, right: 30, top: 30, bottom: 40 },
                xAxis: {
                    type: 'category', data: dates,
                    axisLine: { lineStyle: { color: '#1f2a3d' } },
                    axisLabel: { color: '#9ca3af', fontSize: 11 },
                },
                yAxis: {
                    type: 'value', scale: true,
                    axisLine: { show: false },
                    splitLine: { lineStyle: { color: '#1f2a3d', type: 'dashed' } },
                    axisLabel: { color: '#9ca3af', fontSize: 11,
                                  formatter: v => (v / 10000).toFixed(1) + '万' },
                },
                series: [{
                    name: '权益', type: 'line', data: values,
                    symbol: 'none',
                    lineStyle: { color: '#3b82f6', width: 1.5 },
                    areaStyle: {
                        color: {
                            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(59,130,246,0.25)' },
                                { offset: 1, color: 'rgba(59,130,246,0)' },
                            ],
                        },
                    },
                    markArea,
                }],
                dataZoom: [{ type: 'inside' }],
            });
            window.addEventListener('resize', () => _equityChart && _equityChart.resize());
        }

        // ============ 网格搜索页（修复C/H：训练段参考·弱化展示） ============
        async function loadGrid() {
            const el = document.getElementById('gridContent');
            el.innerHTML = '<div class="loading">加载中</div>';
            try {
                const res = await fetch('/api/grid');
                const data = await res.json();
                const grids = data.grids || {};
                const keys = Object.keys(grids);
                if (keys.length === 0) {
                    el.innerHTML = '<div class="empty-state">暂无网格数据</div>';
                    return;
                }
                const warn = `
                    <div style="border-left:3px solid var(--amber);padding-left:12px;color:var(--amber);font-size:12px;margin:0 0 16px">
                        ⚠️ 下表为<b>训练段参考</b>（含幸存者偏差，非实盘口径）——网格最优格仅用于横向比较，
                        不作为实盘参数依据；实盘参数见 settings.yaml（决策日志纪律）。
                    </div>
                `;
                el.innerHTML = warn + `
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>网格</th><th>最优参数</th><th>收益*</th><th>卡玛</th><th>轮次</th><th>稳健点</th><th>原参数判定</th></tr></thead>
                            <tbody>
                                ${keys.map(k => {
                                    const g = grids[k];
                                    const b = g.best || {};
                                    const orig = g.orig_robust == null ? '-' :
                                        (g.orig_robust ? '<span class="pos">✓ 稳健</span>' : '<span class="neg">✗ 不稳健</span>');
                                    return `<tr>
                                        <td><strong>${esc(k)}</strong><br><small style="color:var(--text-muted)">${esc(g.label || '')}</small></td>
                                        <td>ma5=${b.ma5_dev} fresh=${b.freshness} chase=${b.chasing}</td>
                                        <td class="${fmt.color(b.total_return)}">${fmt.pct(b.total_return)}</td>
                                        <td>${b.calmar?.toFixed(2) ?? '-'}</td>
                                        <td>${b.trades ?? '-'}</td>
                                        <td>${g.robust_points != null ? `${g.robust_points}/${g.count}` : '-'}</td>
                                        <td>${orig}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top:16px;color:var(--text-muted);font-size:12px">
                        稳健点 = 自身+一阶邻域全正的参数组合数；*收益含幸存者偏差（乐观口径）。
                        热力图见 outputs/grid_heatmap_*.png
                    </div>
                `;
            } catch (e) {
                el.innerHTML = '<div class="empty-state">后端未启动</div>';
            }
        }

        // ============ 市场热力图（第八轮需求2：日级刷新） ============
        let hmChart = null, hmDim = 'industry', hmLastDate = null, hmTimer = null;

        // A股红涨绿跌：涨跌幅 → 背景色
        function hmColor(p) {
            if (p == null) return '#64748b';
            const c = Math.min(Math.abs(p) / 8, 1);   // ±8% 封顶饱和
            if (p > 0) return `rgba(239, 68, 68, ${0.25 + 0.6 * c})`;   // 红
            if (p < 0) return `rgba(34, 197, 94, ${0.25 + 0.6 * c})`;   // 绿
            return '#475569';
        }

        function switchHeatmapDim(dim, btn) {
            hmDim = dim;
            document.querySelectorAll('.hm-dim-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadHeatmap(true);
        }

        async function loadHeatmap(force = false) {
            const el = document.getElementById('heatmapChart');
            const meta = document.getElementById('heatmapMeta');
            try {
                const res = await fetch(`/api/heatmap?dim=${hmDim}`);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    // 先销毁实例再写占位（innerHTML 会移除 ECharts canvas，不清实例会导致后续永久空白）
                    if (hmChart) { hmChart.dispose(); hmChart = null; }
                    el.innerHTML = `<div class="empty-state" style="padding:60px 0;">${esc(err.detail || '数据不可用')}</div>`;
                    meta.textContent = '-';
                    return;
                }
                const d = await res.json();
                // 日级数据：日期未变且非强制 → 跳过重绘（避免闪动）
                if (!force && d.trade_date === hmLastDate && hmChart) return;
                hmLastDate = d.trade_date;
                const fd = (d.trade_date || '').replace(/^(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
                meta.textContent = `${fd} · ${d.count} 只`;
                renderHeatmap(d);
                // 自动刷新（X 秒轮询；页面隐藏/切走时暂停，不空转）
                if (!hmTimer) {
                    const seconds = 30;
                    document.getElementById('heatmapRefreshNote').textContent = `每 ${seconds}s 自动检查更新`;
                    hmTimer = setInterval(() => {
                        const page = document.getElementById('page-heatmap');
                        if (document.hidden || !page.classList.contains('active')) return;
                        loadHeatmap(false);
                    }, seconds * 1000);
                }
            } catch (e) {
                if (hmChart) { hmChart.dispose(); hmChart = null; }
                el.innerHTML = '<div class="empty-state" style="padding:60px 0;">后端未启动</div>';
            }
        }

        function renderHeatmap(d) {
            const el = document.getElementById('heatmapChart');
            if (typeof echarts === 'undefined') {
                el.innerHTML = '<div class="empty-state">echarts.min.js 加载失败（web/static/vendor/）</div>';
                return;
            }
            if (!hmChart) {
                el.innerHTML = '';   // 清掉可能的错误占位文本
                hmChart = echarts.init(el);
                // 仅在热力图页可见时 resize（隐藏页 resize 会把图表压成 0×0）
                window.addEventListener('resize', () => {
                    const page = document.getElementById('page-heatmap');
                    if (hmChart && page.classList.contains('active')) hmChart.resize();
                });
            }
            const data = d.children.map(g => ({
                name: g.name,
                value: g.value,
                avg_pct: g.avg_pct,
                itemStyle: { color: hmColor(g.avg_pct) },
                children: (g.children || []).map(l => ({
                    name: l.name,
                    code: l.code,
                    value: l.value,
                    pct_chg: l.pct_chg,
                    close: l.close,
                    itemStyle: { color: hmColor(l.pct_chg) },
                })),
            }));
            hmChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    formatter: info => {
                        const v = info.data;
                        if (v.code) {
                            return `<b>${esc(v.name)}</b> ${esc(v.code)}<br>` +
                                `涨跌幅：${v.pct_chg != null ? v.pct_chg.toFixed(2) + '%' : '-'}<br>` +
                                `收盘：${v.close ?? '-'}<br>成交额：${(v.value / 100000).toFixed(2)} 亿`;
                        }
                        return `<b>${esc(v.name)}</b><br>` +
                            `平均涨跌：${v.avg_pct != null ? v.avg_pct.toFixed(2) + '%' : '-'}<br>` +
                            `成交额合计：${(v.value / 100000).toFixed(2)} 亿`;
                    },
                },
                series: [{
                    type: 'treemap',
                    roam: false, nodeClick: 'zoomToNode',
                    breadcrumb: { show: true, bottom: 0 },
                    label: {
                        show: true, formatter: p => {
                            const pct = p.data.pct_chg != null ? p.data.pct_chg : p.data.avg_pct;
                            const pctTxt = pct != null ? `${pct > 0 ? '+' : ''}${pct.toFixed(1)}%` : '';
                            // 问题2（第九轮）：rich 标签转义——name 含 { } | 会
                            // 破坏富文本 {n|...} 语法导致标签渲染异常（乱码样）
                            const safeName = String(p.name ?? '').replace(/[{}|]/g, '');
                            return `{n|${safeName}}\n{p|${pctTxt}}`;
                        },
                        rich: {
                            n: { fontSize: 11, color: '#fff', fontWeight: 600 },
                            p: { fontSize: 12, color: '#fff' },
                        },
                    },
                    itemStyle: { borderColor: 'rgba(0,0,0,.35)', borderWidth: 1, gapWidth: 2 },
                    upperLabel: { show: true, height: 22, color: '#fff' },
                    levels: [
                        { itemStyle: { gapWidth: 3 } },
                        { colorSaturation: [0.3, 0.6] },
                    ],
                    data,
                }],
            });
            hmChart.off('click');
            hmChart.on('click', p => {
                if (p.data && p.data.code) openHmDetail(p.data.code, p.data.name);
            });
        }

        async function openHmDetail(code, name) {
            const modal = document.getElementById('hmDetailModal');
            document.getElementById('hmDetailTitle').textContent = `${name || ''}（${code}）`;
            document.getElementById('hmDetailInfo').textContent = '加载中...';
            document.getElementById('hmDetailTable').innerHTML = '';
            modal.style.display = 'flex';
            try {
                const res = await fetch(`/api/heatmap/detail?code=${encodeURIComponent(code)}`);
                if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
                const d = await res.json();
                const i = d.info || {};
                document.getElementById('hmDetailInfo').textContent =
                    `${i.industry || '未知'}${i.area ? ' · ' + i.area : ''} · ${code}`;
                document.getElementById('hmDetailTable').innerHTML = `
                    <div class="table-wrap"><table>
                        <thead><tr><th>日期</th><th>开盘</th><th>最高</th><th>最低</th><th>收盘</th><th>涨跌幅</th><th>成交额(亿)</th></tr></thead>
                        <tbody>${d.bars.map(b => {
                            const cls = b.pct_chg > 0 ? 'up' : (b.pct_chg < 0 ? 'dn' : '');
                            return `<tr>
                                <td>${esc(b.date)}</td>
                                <td>${b.open ?? '-'}</td><td>${b.high ?? '-'}</td><td>${b.low ?? '-'}</td>
                                <td class="${cls}">${b.close ?? '-'}</td>
                                <td class="${cls}">${b.pct_chg != null ? (b.pct_chg > 0 ? '+' : '') + b.pct_chg.toFixed(2) + '%' : '-'}</td>
                                <td>${b.amount != null ? (b.amount / 100000).toFixed(2) : '-'}</td>
                            </tr>`;
                        }).join('')}</tbody>
                    </table></div>
                    <p style="margin:8px 0 0;font-size:12px;color:var(--text-muted)">近 10 个交易日（Tushare 日线缓存）</p>`;
            } catch (e) {
                document.getElementById('hmDetailInfo').textContent = `详情加载失败：${e.message || e}`;
            }
        }

        function closeHmDetail() {
            document.getElementById('hmDetailModal').style.display = 'none';
        }

        // ============ 系统设置页（第十轮需求1/2/3：分组+建议+diff 预览+确认） ============
        let _setBase = null;      // GET /api/settings 原始返回
        let _setDraft = {};       // changes 草稿：key → 新值
        let _setSecrets = {};     // secrets 草稿：name → 明文（仅提交用，不回显）

        async function loadSettings() {
            const el = document.getElementById('settingsContent');
            el.innerHTML = '<div class="loading">加载中</div>';
            try {
                const res = await fetch('/api/settings');
                const d = await res.json();
                if (d.error) {
                    el.innerHTML = `<div class="empty-state">${esc(d.error)}</div>`;
                    return;
                }
                _setBase = d; _setDraft = {}; _setSecrets = {};
                document.getElementById('settingsNote').textContent = d.note || '';
                renderSettings(d);
                refreshSettingsButtons();
                setSettingsMsg('');
            } catch (e) {
                el.innerHTML = '<div class="empty-state">后端未启动</div>';
            }
        }

        function renderSettings(d) {
            const el = document.getElementById('settingsContent');
            const order = ['通知', 'AI 总结', '热力图', '资金控制', '策略与风控'];
            const byGroup = {};
            for (const [key, m] of Object.entries(d.metadata || {})) {
                (byGroup[m.group] = byGroup[m.group] || []).push([key, m]);
            }
            let html = '';
            for (const g of order) {
                const items = byGroup[g] || [];
                if (!items.length) continue;
                html += `<h3 style="margin:18px 0 4px;font-size:14px;color:var(--text-primary);border-bottom:1px solid var(--border);padding-bottom:8px;">${esc(g)}</h3>`;
                for (const [key, m] of items) {
                    const badgeCls = {ok: 'set-badge-ok', warn: 'set-badge-warn', lock: 'set-badge-lock'}[m.badge] || 'set-badge-lock';
                    if (!m.editable) {
                        // 冻结期锁定组：键值只读表
                        const obj = (d.locked || {})[key] || {};
                        html += `<div class="set-row"><div class="set-main">
                            <div class="set-label">🔒 ${esc(m.label)}</div>
                            <div class="set-desc">${esc(m.description || '')}</div>
                            <div class="set-rec ${badgeCls}">${esc(m.recommendation || '')}</div>
                            <div class="table-wrap" style="margin-top:8px;"><table><tbody>
                                ${Object.entries(obj).map(([k, v]) =>
                                    `<tr><td><code>${esc(k)}</code></td><td><code>${esc(String(v))}</code></td></tr>`).join('')}
                            </tbody></table></div>
                        </div></div>`;
                    } else if (typeof (d.settings || {})[key] === 'boolean') {
                        html += `<div class="set-row"><div class="set-main">
                            <div class="set-label">${esc(m.label)}</div>
                            <div class="set-desc">${esc(m.description || '')}</div>
                            <div class="set-rec ${badgeCls}">${esc(m.recommendation || '')}</div>
                        </div>
                        <input type="checkbox" class="set-toggle" ${d.settings[key] ? 'checked' : ''}
                               onchange="onSetChange('${key}', this.checked)"></div>`;
                    } else {
                        html += `<div class="set-row"><div class="set-main">
                            <div class="set-label">${esc(m.label)}</div>
                            <div class="set-desc">${esc(m.description || '')}</div>
                            <div class="set-rec ${badgeCls}">${esc(m.recommendation || '')}</div>
                            <input type="text" class="set-input" value="${esc(d.settings[key] ?? '')}"
                                   placeholder="https://hc-ping.com/<uuid>"
                                   oninput="onSetChange('${key}', this.value)">
                        </div></div>`;
                    }
                }
                if (g === 'AI 总结') html += _secretRows(d);
            }
            el.innerHTML = html;
        }

        // 密钥输入（掩码显示当前值；写入 data/secrets.json，两容器共享）
        function _secretRows(d) {
            const sec = d.secrets || {};
            return `<div class="set-row"><div class="set-main">
                <div class="set-label">AI API Key</div>
                <div class="set-desc">当前：${esc(sec.ai_summary_api_key || '未配置')}（存 data/secrets.json，下次巡检生效）</div>
                <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
                    <input type="password" class="set-input" id="secAiKey" placeholder="sk-..." style="flex:1;min-width:220px;margin-top:0;"
                           oninput="onSecretInput('ai_summary_api_key', this.value)">
                    <button class="hm-dim-btn" style="margin-top:0;" onclick="testAiKey()">测试连接</button>
                </div>
                <div id="aiKeyTestResult" style="font-size:12px;margin-top:4px;color:var(--text-muted);"></div>
            </div></div>
            <div class="set-row"><div class="set-main">
                <div class="set-label">邮件授权码（SMTP auth_code）</div>
                <div class="set-desc">当前：${esc(sec.email_auth_code || '未配置')}；需同时在下方"通知"组开启邮件通知并配置发件邮箱</div>
                <input type="password" class="set-input" id="secEmailCode" placeholder="授权码（非登录密码）"
                       oninput="onSecretInput('email_auth_code', this.value)">
            </div></div>`;
        }

        function onSetChange(key, val) {
            _setDraft[key] = val;
            refreshSettingsButtons();
        }

        function onSecretInput(name, val) {
            if (val) _setSecrets[name] = val;
            else delete _setSecrets[name];
            refreshSettingsButtons();
        }

        function refreshSettingsButtons() {
            const has = Object.keys(_setDraft).length || Object.keys(_setSecrets).length;
            document.getElementById('btnPreview').disabled = !has;
            document.getElementById('btnApply').disabled = true;
            document.getElementById('previewCard').style.display = 'none';
        }

        function previewSettings() {
            const meta = (_setBase || {}).metadata || {};
            const rows = Object.entries(_setDraft).map(([k, v]) => {
                const m = meta[k] || {};
                const oldV = ((_setBase || {}).settings || {})[k];
                const warn = m.badge === 'warn'
                    ? `<div style="color:var(--amber);font-size:12px;margin-top:2px;">⚠️ ${esc(m.recommendation || '')}</div>` : '';
                return `<div style="padding:8px 0;border-bottom:1px dashed var(--border);">
                    <div>${esc(m.label || k)}：<code>${esc(String(oldV))}</code> → <code>${esc(String(v))}</code></div>${warn}</div>`;
            }).join('');
            const secs = Object.keys(_setSecrets).map(k => {
                const label = k === 'ai_summary_api_key' ? 'AI API Key' : '邮件授权码';
                return `<div style="padding:8px 0;border-bottom:1px dashed var(--border);">
                    <div>${label}：更新为 <code>******</code>（明文仅写入 data/secrets.json，审计只记掩码）</div></div>`;
            }).join('');
            document.getElementById('previewDiff').innerHTML = (rows + secs)
                || '<div class="empty-state">无变更</div>';
            document.getElementById('previewCard').style.display = '';
            document.getElementById('btnApply').disabled = false;
            setSettingsMsg('请核对以上变更，再点"确认应用"。');
        }

        async function applySettings() {
            setSettingsMsg('保存中...');
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({confirm: true, changes: _setDraft, secrets: _setSecrets}),
                });
                const d = await res.json();
                if (!res.ok) {
                    setSettingsMsg(`保存失败：${d.detail || res.status}`, true);
                    return;
                }
                setSettingsMsg(`✅ ${d.effective || '已保存'}`);
                await loadSettings();
            } catch (e) {
                setSettingsMsg('保存失败：后端未启动', true);
            }
        }

        async function testAiKey() {
            const out = document.getElementById('aiKeyTestResult');
            out.textContent = '测试中...';
            out.style.color = 'var(--text-muted)';
            try {
                const key = (document.getElementById('secAiKey').value || '').trim();
                const res = await fetch('/api/settings/test_ai_key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: key}),
                });
                const d = await res.json();
                out.textContent = (d.ok ? '✅ ' : '❌ ') + (d.detail || '');
                out.style.color = d.ok ? 'var(--green)' : 'var(--red)';
            } catch (e) {
                out.textContent = '❌ 请求失败（后端未启动）';
                out.style.color = 'var(--red)';
            }
        }

        function setSettingsMsg(msg, isErr) {
            const el = document.getElementById('settingsMsg');
            el.textContent = msg || '';
            el.style.color = isErr ? 'var(--red)' : 'var(--text-muted)';
        }

        // 初始加载
        loadDashboard();
    </script>
</body>
</html>
