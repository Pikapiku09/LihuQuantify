- id: H-2026-11-16-003
  title: 基本面质量能区分盈利波与亏损波
  rationale: 用户提问：赚钱的波段是否与我买时的基本面有关。现有 KB_VERIFIED 已证「业绩类无alpha且反向（预告+财报双口径）」，但那是对全市场 1742 个样本的横截面测试，未在用户自己的
    122 波上验证过。本假设在用户真实交割单上做 PIT 复核，方向预测：不相关或弱相关（即基本面好并不带来更高波收益）。
  pre_registered_at: '2026-11-16'
  method:
    pairing: wave
    universe: 用户真实交割单 122 个已清仓波（2024-10-15~2026-11-10，81 只）；基本面取 PIT 口径 ann_date<=buy_date 的最近一期
    is_window:
    - '2024-10-15'
    - '2025-12-31'
    oos_window:
    - '2026-01-01'
    - '2026-11-10'
  pass_criteria:
    min_oos_improvement_pp: 2.0
    max_mdd_increase_pp: 5.0
    require_significance: true
  status: failed
  evidence: OOS 73 波（有效样本 52~54）：ROE δ=-0.050 p=0.772；净利同比 δ=-0.143 p=0.395；营收同比 δ=+0.002 p=1.000；毛利率
    δ=+0.079 p=0.645；PB三年分位 δ=+0.078 p=0.644。BH-FDR 校正后 p>=0.80，全部未达 |δ|>=0.33 门槛。全样本 122 波结论相同（|δ|<=0.19，FDR>=0.51，最大为
    PE_TTM δ=-0.186 p=0.152）。对照特征：进场涨幅 δ=0.625（全样本）/0.647（OOS，p<1e-4，FDR=0.000）；买入后5日涨幅 0.463/0.528（FDR=0.001），两项均为大效应且
    IS/OOS 稳定。结论：基本面质量完全不解释波收益差异；方向与「基本面好才赚钱」相反（PE/净利同比略偏负）但无统计意义。与 KB_VERIFIED 既有「业绩类无alpha且反向」一致。
  decided_at: '2026-11-16'
- id: H-2026-11-16-004
  title: 技术面好但基本面烂的波应回避（交互效应）
  rationale: 用户直觉：技术面不错但基本面比较烂的票不值得介入。检验方式：按进场涨幅（技术面代理）x 基本面分档做 2x2，比较「技术好+基本面好」与「技术好+基本面烂」的胜率差。方向预测：不显著——归因已显示进场时点解释
    55% 的收益差异，基本面边际解释力弱，故预期两者胜率差 <10pp。
  pre_registered_at: '2026-11-16'
  method:
    pairing: wave
    universe: 用户真实交割单 122 个已清仓波，按进场涨幅 >5% 定义为技术面好；基本面按净利同比与 ROE 中位数二分
    is_window:
    - '2024-10-15'
    - '2025-12-31'
    oos_window:
    - '2026-01-01'
    - '2026-11-10'
  pass_criteria:
    min_oos_improvement_pp: 10.0
    max_mdd_increase_pp: 5.0
    require_significance: true
  status: failed
  evidence: 技术好（进场涨幅>5%）组：基本面好（ROE>=中位 5.10）胜率 61.5%（n=26，均值盈亏 +451 元）vs 基本面烂 70.6%（n=17，均值盈亏 +2,373 元），差
    -9.0pp，方向与「基本面烂应回避」相反，未达 +10pp 门槛。按净利同比中位二分同理：63.0% vs 68.8%，差 -5.8pp。技术差（<=+2%）组：基本面好 0.0%（n=7）vs
    烂 11.1%（n=9），差 -11.1pp 但 n 过小且两组都不赚钱。结论：驳回「技术面好但基本面烂应回避」——真正该回避的是「买入后没有继续上行」（进场涨幅<=2% 全样本胜率 9.5%、OOS
    0%），与该票基本面无关。
  decided_at: '2026-11-16'
