- id: H-2026-11-16-006
  title: 小市值池回测收益优于大市值池
  rationale: 第九节测出用户买入时市值分位中位 93.3%（只买全市场市值前 7%），而 A 股历史上有小市值效应。用户问「买小盘会不会更好」，但自己的 83 波样本全是自己下的单、无法回答反事实。故做独立回测：同一策略、同一时间窗、同一股票数、同一仓位上限，只把股票池按窗口起点市值三分位切开。方向预测：小市值池名义收益可能更高，但费用与流动性折损会吃掉大部分（策略有日均成交额>=1亿的前置硬过滤，小盘池本身就被截断）。
  pre_registered_at: '2026-11-16'
  method:
    pairing: fifo
    universe: 按回测窗口起点 daily_basic.total_mv 三分位切池（大/中/小各 50 只，固定种子 42），剔除 688/300/301/北交所/ST/退市；同一策略 CherryClaw、同一窗口、同一
      init_capital、同一 max_single_position
    is_window:
    - '2024-10-15'
    - '2025-12-31'
    oos_window:
    - '2026-01-01'
    - '2026-11-13'
  pass_criteria:
    min_oos_improvement_pp: 2.0
    max_mdd_increase_pp: 5.0
    require_significance: false
  status: failed
  evidence: 按预注册口径（CherryClaw、锚定日 2024-11-13 市值三分位、各 50 只）跑种子 42/7/123。总收益（小盘/中盘/大盘）：seed42 +15.86%/-4.11%/-16.67%（小盘超额
    +32.5pp）、seed7 -8.22%/-25.75%/-5.78%（小盘超额 -2.4pp，方向反转）、seed123 +0.05%/-18.40%/-23.28%（+23.3pp）。IS（2024-10-14~2025-12-31）三个种子小盘均胜大盘；OOS（2026-01-01~2026-11-13）2/3
    胜（seed42 +7.64% vs -7.11%、seed123 +6.78% vs -4.86%），seed7 反向（-1.57% vs +10.82%）。中位超额 +23.3pp，但标准差约
    18pp，n=3 无法拒绝零。关键否证：换成实盘主策略 intraday_reversal（settings.main_strategy）后效应消失——seed42 总收益 小盘 -4.77%/中盘
    +2.96%/大盘 -4.52%，最大回撤三池几乎相同（-10.79%/-11.50%/-10.94%），完全没有单调关系。判定 failed 的理由：① 1/3 种子方向反转，不满足「可上线规则」的稳健性；②
    换成实盘策略后效应不存在，说明这是 CherryClaw 动量入场规则与小盘的交互，不是市场规律。补记：本回测的小盘池仍受策略「近20日日均成交额>=1亿」前置硬过滤，并非真正的小微盘；且按当前上市股票构建，存在幸存者偏差（三池同等受影响）。
