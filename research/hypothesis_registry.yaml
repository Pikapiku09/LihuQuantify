- id: H-2026-11-14-002
  title: 分批止盈优于一次性清仓
  rationale: 用户真实交割单（2024-09-23~2026-11-13）：分批止盈 73 波 +22,593 元（61.6%）vs 一次性清仓 41 波 −19,728 元（39.0%）；⚠
    分批波仓位大 3.1 倍、持有久 2.9 倍，未做仓位/期限中性化，必须 OOS 复核后才可采纳。
  pre_registered_at: '2026-11-14'
  method:
    pairing: wave
    universe: 用户真实交割单（gb18030 原始记录；仅证券买入/卖出，排除天天宝与银证转账）
    is_window:
    - '2024-09-23'
    - '2025-12-31'
    oos_window:
    - '2026-01-01'
    - '2026-11-13'
  pass_criteria:
    min_oos_improvement_pp: 2.0
    max_mdd_increase_pp: 5.0
    require_significance: true
    decision_rule: OOS 超额 >=+2.0pp 且显著（p<0.05）。【事后补记】原预注册未写「仓位/期限中性化」要求，中性化是判定时新增的条件——该条件只会让门槛更严（中性化后仍显著才算过），方向保守，故结论可接受。
  status: passed
  evidence: 中性化后 OOS 显著。样本 122 波（一次性 46 / 分批 76）。原始对比：一次性 -19,907 元、胜率 34.8%、均值收益 -1.34%、中位持有 5 天、中位成本
    14,246；分批 +33,222 元、胜率 65.8%、均值 +2.96%、中位持有 18 天、中位成本 34,377。做法：比收益率（不是盈亏额）消仓位量级 + 同持有期分箱 + OLS 控制
    log(持有天数)/log(成本)。结果：分箱 ≤7 天 分批 +7.39pp、8~30 天 +5.64pp、>30 天 -16.63pp（一次性仅 3 波，n 太小）；OLS 分批系数 全样本
    +5.02pp t=+2.64（显著）、IS +2.20pp t=+0.48（不显著）、OOS +4.02pp t=+2.42（显著）；Cliff's delta +0.331（中效应）、Mann-Whitney
    p=0.0023。通过预注册门槛（OOS +4.02pp>=2.0pp 且要求显著的 p<0.05）。max_mdd_increase_pp 在收益对比里不适用（非策略回测），记 N/A。重要限定：这是观察性结果，存在反向因果——「赚了才分批出」与「分批出所以赚」在数据上无法区分；分批波仓位大
    2.4 倍、持有久 3.6 倍，线性控制未必完全中性化；>30 天分箱方向反转。故结论只能是「分批止盈这个习惯没有证据表明有害，且与更高收益相关」，不能据此声称分批止盈本身产生 alpha。
  decided_at: '2026-11-16'
  notes: rationale 与 evidence 的样本不一致，原因是口径不同而非算错：rationale 来自 《收益归因_基本面与消息面_20261116.md》的 114 波口径（剔除 8
    个行情覆盖不足的波）；evidence 来自 scripts/analyze_batch_exit.py 的 122 波口径（未剔除）。两组数（73/41 波 vs 76/46 波、+22,593/-19,728
    元 vs +33,222/-19,907 元、仓位 3.1 倍 vs 2.4 倍）因此不可直接相加或比较。截止 2026-11-16 未做 114 波口径的复算。
