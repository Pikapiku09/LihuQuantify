<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LihuQuantify · 量化监控看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* ============ 设计系统 ============ */
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #111827;
            --bg-hover: #1f2937;
            --bg-input: #1a2235;
            --border: #1f2a3d;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Noto Sans SC", sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============ 布局 ============ */
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: var(--transition);
        }
        .sidebar-logo {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .sidebar-logo span {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }
        .nav-item {
            padding: 12px 24px;
            margin: 4px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            transition: var(--transition);
            font-size: 14px;
        }
        .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            font-weight: 600;
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-badge {
            margin-left: auto;
            background: var(--accent);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }
        .main {
            margin-left: 220px;
            flex: 1;
            padding: 32px;
            max-width: 1400px;
        }

        /* ============ 页面切换动画 ============ */
        .page { display: none; animation: fadeIn 0.35s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ 卡片 ============ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover { border-color: #2d3f55; }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* ============ 指标网格 ============ */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .metric-card:hover { transform: translateY(-2px); border-color: var(--accent); }
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .metric-card:hover::before { opacity: 1; }
        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .metric-value.positive { color: var(--green); }
        .metric-value.negative { color: var(--red); }
        .metric-value.neutral { color: var(--text-primary); }
        .metric-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ============ 状态徽章 ============ */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .badge-uptrend { background: rgba(16,185,129,0.15); color: var(--green); }
        .badge-sideways { background: rgba(245,158,11,0.15); color: var(--amber); }
        .badge-downtrend { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* ============ 表格 ============ */
        .table-wrap { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        tr:hover td { background: var(--bg-hover); }
        td .pos { color: var(--green); }
        td .neg { color: var(--red); }
        /* 第六轮清单2/3：A股口径红涨绿跌（涨=red，跌=green），用于价格/盈亏类数值 */
        .up { color: var(--red); font-weight: 600; }
        .dn { color: var(--green); font-weight: 600; }
        .metric-value.up { color: var(--red); }
        .metric-value.dn { color: var(--green); }

        /* ============ 图表容器 ============ */
        .chart-box {
            width: 100%;
            height: 320px;
            margin-top: 8px;
        }

        /* ============ 报告页 ============ */
        .report-list { display: grid; gap: 12px; }
        .report-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .report-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }
        .report-date { font-weight: 600; font-size: 15px; }
        .report-meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
        .report-view {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-top: 20px;
            line-height: 1.8;
            font-size: 14px;
        }
        .report-view h1, .report-view h2, .report-view h3 { margin: 20px 0 12px; }
        .report-view h1 { font-size: 20px; color: var(--text-primary); }
        .report-view h2 { font-size: 16px; color: var(--text-primary); }
        .report-view table { font-size: 13px; margin: 12px 0; }
        .report-view th, .report-view td { padding: 8px 12px; }
        .report-view code {
            background: var(--bg-hover);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .report-view blockquote {
            border-left: 3px solid var(--amber);
            padding-left: 16px;
            color: var(--amber);
            margin: 12px 0;
        }
        .back-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
            margin-bottom: 16px;
        }
        .back-btn:hover { background: var(--bg-card); color: var(--text-primary); }

        /* ============ 加载/空状态 ============ */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-muted);
        }
        .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }

        /* ============ 响应式 ============ */
        @media (max-width: 900px) {
            .sidebar { width: 64px; }
            .sidebar-logo h1, .sidebar-logo span { display: none; }
            .nav-item { padding: 12px; justify-content: center; }
            .nav-item span { display: none; }
            .main { margin-left: 64px; padding: 20px; }
            .metric-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ============ 滚动条 ============ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h1>LihuQuantify</h1>
                <span>量化监控看板</span>
            </div>
            <nav>
                <div role="button" tabindex="0" class="nav-item active" onclick="showPage('dashboard', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
                    <span>仪表盘</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('reports', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span>巡检报告</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('backtest', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    <span>回测分析</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('grid', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    <span>网格搜索</span>
                </div>
                <div role="button" tabindex="0" class="nav-item" onclick="showPage('heatmap', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>

                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>系统配置</span>
                </div>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main">
            <!-- ============ 仪表盘 ============ -->
            <div class="page active" id="page-dashboard">
                <div class="metric-grid" id="metricsGrid">
                    <div class="loading">加载中</div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--accent)"></span>持仓与止损监控</div>
                        <span class="badge badge-sideways" id="marketBadge">-</span>
                    </div>
                    <div class="table-wrap">
                        <table id="positionsTable">
                            <thead><tr><th>代码</th><th>名称</th><th>持股</th><th>成本</th><th>现价</th><th>市值</th><th>浮动盈亏</th><th>盈亏%</th><th>止损线</th><th>状态</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div id="pendingStops" style="margin-top:12px;"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--green)"></span>近 10 笔交易</div>
                    </div>
                    <div class="table-wrap">
                        <table id="tradesTable">
                            <thead><tr><th>日期</th><th>代码</th><th>方向</th><th>价格</th><th>数量</th><th>盈亏</th><th>原因</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ============ 报告页 ============ -->
            <div class="page" id="page-reports">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--purple)"></span>每日巡检报告</div>
                    </div>
                    <div class="report-list" id="reportList">
                        <div class="loading">加载中</div>
                    </div>
                </div>
                <div id="reportView"></div>
            </div>

            <!-- ============ 回测页 ============ -->
            <div class="page" id="page-backtest">
                <div class="metric-grid" id="backtestMetrics"></div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--cyan)"></span>绩效指标详情</div>
                    </div>
                    <div id="backtestDetail"><div class="loading">加载中</div></div>
                </div>
            </div>

            <!-- ============ 网格搜索页 ============ -->
            <div class="page" id="page-grid">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--amber)"></span>参数网格搜索结果</div>
                    </div>
                    <div id="gridContent"><div class="loading">加载中</div></div>
                </div>
            </div>

            <!-- ============ 市场热力图页（第八轮需求2） ============ -->
            <div class="page" id="page-heatmap">
                <div class="card">
                    <div class="card-header" style="flex-wrap:wrap;gap:8px;">
                        <div class="card-title"><span class="dot" style="background:var(--red)"></span>市场热力图</div>
                        <div style="display:flex;gap:6px;" id="heatmapDimBtns">
                            <button class="hm-dim-btn active" data-dim="industry" onclick="switchHeatmapDim('industry', this)">按行业</button>
                            <button class="hm-dim-btn" data-dim="pct_bucket" onclick="switchHeatmapDim('pct_bucket', this)">按涨跌幅</button>
                            <button class="hm-dim-btn" data-dim="amount_bucket" onclick="switchHeatmapDim('amount_bucket', this)">按成交额</button>
                        </div>
                        <span class="badge" id="heatmapMeta">-</span>
                    </div>
                    <p style="margin:0 0 8px;font-size:12px;color:var(--text-muted);">
                        面积=成交额，颜色=当日涨跌幅（红涨绿跌）；点击行业块下钻，点击个股查看详情。
                        数据随每日巡检更新（日级），<span id="heatmapRefreshNote"></span>。
                    </p>
                    <div id="heatmapChart" style="width:100%;height:560px;"></div>
                </div>
            </div>

            <!-- ============ 系统配置页（第八轮） ============ -->
            <div class="page" id="page-config">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span class="dot" style="background:var(--purple)"></span>系统配置（只读）</div>
                    </div>
                    <div id="configContent"><div class="loading">加载中</div></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 热力图个股详情弹窗 -->
    <div id="hmDetailModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;" onclick="if(event.target===this)closeHmDetail()">
        <div style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:10px;max-width:640px;width:92%;max-height:80vh;overflow:auto;padding:18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <div id="hmDetailTitle" style="font-size:16px;font-weight:600;"></div>
                <button onclick="closeHmDetail()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;">×</button>
            </div>
            <div id="hmDetailInfo" style="font-size:13px;color:var(--text-muted);margin-bottom:10px;"></div>
            <div id="hmDetailTable"></div>
        </div>
    </div>

    <script src="/static/vendor/echarts.min.js"></script>

    <script>
        // ============ 页面切换 ============
        function showPage(name, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');
            el.classList.add('active');
            if (name === 'dashboard') loadDashboard();
            if (name === 'reports') loadReports();
            if (name === 'backtest') loadBacktest();
            if (name === 'grid') loadGrid();
            if (name === 'heatmap') loadHeatmap();
            if (name === 'config') loadConfig();
        }

        // ============ 工具 ============
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const fmt = {
            money: v => v == null ? '-' : '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0}),
            // 第六轮：带符号金额（盈亏展示）；A股口径红涨绿跌
            moneySign: v => v == null ? '-' : (v >= 0 ? '+' : '') + '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 0}),
            pct: v => v == null ? '-' : (v * 100).toFixed(2) + '%',

            sign: v => v == null ? '' : v >= 0 ? `+${(v*100).toFixed(2)}%` : `${(v*100).toFixed(2)}%`,
            color: v => v == null ? '' : v >= 0 ? 'positive' : 'negative',
            // A股红涨绿跌 class（零/空 → 中性）
            ud: v => v == null || v === 0 ? 'neutral' : v > 0 ? 'up' : 'dn',
        };

        // 简易 Markdown → HTML（修复H.1：渲染前先转义，防 XSS）
        function mdToHtml(md) {
            const safe = String(md ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return safe
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\`([^\`]+)\`/g, '<code>$1</code>')
                .replace(/^&gt; (.*$)/gim, '<blockquote>$1</blockquote>')
                .replace(/^\s*- \[([x ])\] (.*)$/gim, '<div style="padding-left:8px">• [$1] $2</div>')
                .replace(/^\s*-\s(.*)$/gim, '<div style="padding-left:8px">• $1</div>')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');
        }

        // ============ 市场热力图（第八轮需求2：日级刷新） ============
        let hmChart = null, hmDim = 'industry', hmLastDate = null, hmTimer = null;

        // A股红涨绿跌：涨跌幅 → 背景色
        function hmColor(p) {
            if (p == null) return '#64748b';
            const c = Math.min(Math.abs(p) / 8, 1);   // ±8% 封顶饱和
            if (p > 0) return `rgba(239, 68, 68, ${0.25 + 0.6 * c})`;   // 红
            if (p < 0) return `rgba(34, 197, 94, ${0.25 + 0.6 * c})`;   // 绿
            return '#475569';
        }

        function switchHeatmapDim(dim, btn) {
            hmDim = dim;
            document.querySelectorAll('.hm-dim-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadHeatmap(true);
        }

        async function loadHeatmap(force = false) {
            const el = document.getElementById('heatmapChart');
            const meta = document.getElementById('heatmapMeta');
            try {
                const res = await fetch(`/api/heatmap?dim=${hmDim}`);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    el.innerHTML = `<div class="empty-state" style="padding:60px 0;">${esc(err.detail || '数据不可用')}</div>`;
                    meta.textContent = '-';
                    return;
                }
                const d = await res.json();
                // 日级数据：日期未变且非强制 → 跳过重绘（避免闪动）
                if (!force && d.trade_date === hmLastDate && hmChart) return;
                hmLastDate = d.trade_date;
                meta.textContent = `${d.trade_date} · ${d.count} 只`;
                renderHeatmap(d);
                // 自动刷新（X 秒轮询；数据本身随每日巡检更新）
                if (!hmTimer) {
                    const seconds = 30;
                    document.getElementById('heatmapRefreshNote').textContent = `每 ${seconds}s 自动检查更新`;
                    hmTimer = setInterval(() => loadHeatmap(false), seconds * 1000);
                }
            } catch (e) {
                el.innerHTML = '<div class="empty-state" style="padding:60px 0;">后端未启动</div>';
            }
        }

        function renderHeatmap(d) {
            const el = document.getElementById('heatmapChart');
            if (typeof echarts === 'undefined') {
                el.innerHTML = '<div class="empty-state">echarts.min.js 加载失败（web/static/vendor/）</div>';
                return;
            }
            if (!hmChart) {
                hmChart = echarts.init(el);
                window.addEventListener('resize', () => hmChart && hmChart.resize());
            }
            const data = d.children.map(g => ({
                name: g.name,
                value: g.value,
                avg_pct: g.avg_pct,
                itemStyle: { color: hmColor(g.avg_pct) },
                children: (g.children || []).map(l => ({
                    name: l.name,
                    code: l.code,
                    value: l.value,
                    pct_chg: l.pct_chg,
                    close: l.close,
                    itemStyle: { color: hmColor(l.pct_chg) },
                })),
            }));
            hmChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    formatter: info => {
                        const v = info.data;
                        if (v.code) {
                            return `<b>${esc(v.name)}</b> ${esc(v.code)}<br>` +
                                `涨跌幅：${v.pct_chg != null ? v.pct_chg.toFixed(2) + '%' : '-'}<br>` +
                                `收盘：${v.close ?? '-'}<br>成交额：${(v.value / 100000).toFixed(2)} 亿`;
                        }
                        return `<b>${esc(v.name)}</b><br>` +
                            `平均涨跌：${v.avg_pct != null ? v.avg_pct.toFixed(2) + '%' : '-'}<br>` +
                            `成交额合计：${(v.value / 100000000).toFixed(2)} 亿`;
                    },
                },
                series: [{
                    type: 'treemap',
                    roam: false, nodeClick: 'zoomToNode',
                    breadcrumb: { show: true, bottom: 0 },
                    label: {
                        show: true, formatter: p => {
                            const pct = p.data.pct_chg != null ? p.data.pct_chg : p.data.avg_pct;
                            const pctTxt = pct != null ? `${pct > 0 ? '+' : ''}${pct.toFixed(1)}%` : '';
                            return `{n|${p.name}}\n{p|${pctTxt}}`;
                        },
                        rich: {
                            n: { fontSize: 11, color: '#fff', fontWeight: 600 },
                            p: { fontSize: 12, color: '#fff' },
                        },
                    },
                    itemStyle: { borderColor: 'rgba(0,0,0,.35)', borderWidth: 1, gapWidth: 2 },
                    upperLabel: { show: true, height: 22, color: '#fff' },
                    levels: [
                        { itemStyle: { gapWidth: 3 } },
                        { colorSaturation: [0.3, 0.6] },
                    ],
                    data,
                }],
            });
            hmChart.off('click');
            hmChart.on('click', p => {
                if (p.data && p.data.code) openHmDetail(p.data.code, p.data.name);
            });

        async function openHmDetail(code, name) {
            const modal = document.getElementById('hmDetailModal');
            document.getElementById('hmDetailTitle').textContent = `${name || ''}（${code}）`;
            document.getElementById('hmDetailInfo').textContent = '加载中...';
            document.getElementById('hmDetailTable').innerHTML = '';
            modal.style.display = 'flex';
            try {
                const res = await fetch(`/api/heatmap/detail?code=${encodeURIComponent(code)}`);
                if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
                const d = await res.json();
                const i = d.info || {};
                document.getElementById('hmDetailInfo').textContent =
                    `${i.industry || '未知'}${i.area ? ' · ' + i.area : ''} · ${code}`;
                document.getElementById('hmDetailTable').innerHTML = `
                    <div class="table-wrap"><table>
                        <thead><tr><th>日期</th><th>开盘</th><th>最高</th><th>最低</th><th>收盘</th><th>涨跌幅</th><th>成交额(亿)</th></tr></thead>
                        <tbody>${d.bars.map(b => {
                            const cls = b.pct_chg > 0 ? 'up' : (b.pct_chg < 0 ? 'dn' : '');
                            return `<tr>
                                <td>${esc(b.date)}</td>
                                <td>${b.open ?? '-'}</td><td>${b.high ?? '-'}</td><td>${b.low ?? '-'}</td>
                                <td class="${cls}">${b.close ?? '-'}</td>
                                <td class="${cls}">${b.pct_chg != null ? (b.pct_chg > 0 ? '+' : '') + b.pct_chg.toFixed(2) + '%' : '-'}</td>
                                <td>${b.amount != null ? (b.amount / 100000).toFixed(2) : '-'}</td>
                            </tr>`;
                        }).join('')}</tbody>
                    </table></div>
                    <p style="margin:8px 0 0;font-size:12px;color:var(--text-muted)">近 10 个交易日（Tushare 日线缓存）</p>`;
            } catch (e) {
                document.getElementById('hmDetailInfo').textContent = `详情加载失败：${e.message || e}`;
            }
        }

        function closeHmDetail() {
            document.getElementById('hmDetailModal').style.display = 'none';
        }

        // ============ 系统配置页（第八轮：只读展示） ============
        async function loadConfig() {
            const el = document.getElementById('configContent');
            try {
                const res = await fetch('/api/config');
                const d = await res.json();
                if (d.error) { el.innerHTML = `<div class="empty-state">${esc(d.error)}</div>`; return; }
                const section = (title, obj, notes = {}) => `
                    <h3 style="margin:14px 0 8px;font-size:14px;">${title}</h3>
                    <div class="table-wrap"><table>
                        <thead><tr><th>参数</th><th>当前值</th><th>说明</th></tr></thead>
                        <tbody>${Object.entries(obj).map(([k, v]) => `
                            <tr><td>${esc(k)}</td><td><code>${esc(String(v))}</code></td>
                            <td style="color:var(--text-muted)">${esc(notes[k] || '')}</td></tr>`).join('')}
                        </tbody>
                    </table></div>`;
                el.innerHTML =
                    `<p style="margin:0 0 4px;font-size:13px;color:var(--text-muted)">${esc(d.note || '')}</p>` +
                    `<p style="margin:0 0 4px;font-size:13px;color:var(--text-muted)">操作日志：${esc(d.log_files || '')}</p>` +
                    section('智能资金控制（capital_guard）', d.capital_guard || {}, {
                        enabled: '总开关',
                        min_cash_threshold: '可用现金低于此值 → 跳过全部买入尝试',
                        top_n_enabled: '资金紧张时按评分只买前 N 只',
                        top_n: '候选保留数上限',
                    }) +
                    section('热力图（heatmap）', d.heatmap || {}, {
                        enabled: '总开关', refresh_seconds: '前端轮询间隔（数据为日级）',
                    }) +
                    section('调度（scheduler）', d.scheduler || {}, {
                        daily_scan_cron: '每日巡检时间（cron）', timezone: '时区',
                    }) +
                    section('策略（strategy）', d.strategy || {}) +
                    section('风控（risk）', d.risk || {}) +
                    `<p style="margin:12px 0 0;font-size:12px;color:var(--text-muted)">初始资金：${d.init_capital ?? '-'}（回测/看板参考口径）</p>`;
            } catch (e) {
                el.innerHTML = '<div class="empty-state">后端未启动</div>';
            }
        }

        // 初始加载
        loadDashboard();
    </script>
</body>
</html>
