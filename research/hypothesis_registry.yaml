- id: H-2026-11-16-008
  title: 买入后 5 日涨幅为负即离场，优于基线
  rationale: 行为归因显示：进场涨幅<=2% 的波最终胜率仅 9.5%（OOS 0%），而「进场涨幅」是事后变量不能当信号；实时可得的代理是买入后 5 日涨幅（全样本 delta=0.463、OOS
    0.528、FDR=0.001）。本条把它做成可执行规则：买入后第 5 个交易日收盘，若相对成本涨幅 <0% 则次日全部离场，与基线对比。方向预测：该规则会提高胜率但可能砍掉后段反弹，净效果不确定，故设
    2pp 的净收益门槛。
  pre_registered_at: '2026-11-16'
  method:
    pairing: fifo
    universe: run_full_backtest.py head-50 主板池 + IntradayReversal；基线=原规则，实验组=加「5 日观察哨」离场规则，其余完全相同
    is_window:
    - '2024-10-15'
    - '2025-12-31'
    oos_window:
    - '2026-01-01'
    - '2026-11-13'
  pass_criteria:
    min_oos_improvement_pp: 2.0
    max_mdd_increase_pp: 5.0
    require_significance: false
  status: failed
  evidence: 实验组 = IntradayReversal + FiveDayWatchStrategy（信号 bar 记第0根，第5根 bar 收盘涨幅 <阈值 即全部离场）。结果（50 只主板
    x 2 年，上限 20%）：基线 总收益 -4.06%/回撤 -5.46%/OOS -2.34%；days=5,thr=0% → -5.56%/-6.75%/OOS -4.34%（OOS 净收益
    -2.00pp，未过 +2pp 门槛）；days=5,thr=-2% → -6.03%/-6.81%/OOS -4.35%；days=10,thr=0% → -4.02%/-5.46%/OOS -2.34%。判定
    failed 的直接理由：OOS 净收益 -2.00pp < 门槛 +2.0pp。更重要的诊断：实际只触发 3 次（days=5,thr=-2% 触发 2 次）。原因是规则与现有止损高度重叠——IR
    在窗口内生成 665 个买入信号，其中 328 个在第 5 根 bar 收益为负（离线诊断确认会发 sell），但引擎实际仅成交约 94 笔，且移动止盈 3% / -5% 执行 / -8% 强制止损在观察哨到期前就把亏损单清掉了，最终只有
    3 笔走到第 5 天仍为负。故本实验样本量无检验力，既不能确认也不能强否证该规则。重要限定：本实验是在**已有系统化止损**的引擎里做的；用户真实交易口径下 36% 的波进场增益<=2%、平均持有
    26 天，观察哨可能仍有价值，但需在 wave 口径上另行验证，不能由本实验直接推广或否定。
  decided_at: '2026-11-16'
