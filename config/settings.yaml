# LihuQuantify 全局配置
# 环境变量优先级高于本文件（LIHU_ 前缀）

tushare:
  token: ""                          # 留空则读 token_file
  token_file: "E:/LihuQuantify/tushareMcp.json"   # 支持 MCP JSON 格式或纯文本
  cache_dir: "./data/cache"
  # 接口调用频率上限（继承原 dsh-invest-plugin 纪律）
  rate_limits:
    quote_per_stock: 1               # daily/daily_basic/moneyflow 每股各 1 次
    index_per_run: 1
    sector_per_run: 1
    fina_per_run: 1

duckdb:
  path: "./data/lihu_quant.duckdb"

qmt:
  enabled: false
  path: "C:/国金QMT/bin.x64"
  account: ""

# 模拟盘初始资金
init_capital: 100000

# 股票池：分层抽样池（修复J——head-50 已证实存在池子偏差，2026-08-26 决策日志）
universe:
  pool_mode: "strat"                     # strat=成交额分层抽样 | head=代码排序前N只（旧，已弃用）
  pool_size: 200                          # strat 模式目标数量
  pool_layers: 5                          # 分层数
  pool_seed: 42                           # 抽样种子（可复现）
  exclude_prefix: ["688", "300", "301"]   # 科创/创业板排除
  exclude_st: true
  min_list_days: 60
  min_avg_amount_20d: 100000000          # 20 日日均成交额 ≥ 1 亿

# 主账本策略（2026-09-26 复盘决策 A）
# CherryClaw 成本后年化 -5.92%、零成本仍 -3.29%，根因=入场追短期动量与已证 alpha（A股反转）相反；
# 权重扫描：IR20 权重越高越好（0/100 唯一正收益 +10.25%）。故主账本切 IntradayReversal。
# 单票上限 15% 由 risk.max_single_position 单点定义（2026-11-14 口径统一）：
# 此前 scheduler._build_strategy 对 IntradayReversal 硬编码 min(cfg, 0.15)，
# 而调度器 budget / invest 两条路径按 0.25 计算 —— 同一配置被解释成两个值。
# 现统一为 0.15，禁止任何调用方再硬编码。
main_strategy: "intraday_reversal"     # cherry_claw（旧，已停用）| intraday_reversal

# 策略参数（修复4 网格搜索稳健区域：50只×2年训练段，2026-08-26）
# close_to_ma5_max_dev=0.05 组内 fresh∈{3,5,7,10}×chase∈{0.05,0.08,0.12} 全为正（稳健区域）
# 注意：验证段（2025-12~2026-08 震荡市）该组为负 —— 必须配合市场状态过滤使用（见修复6结论）
strategy:
  ma_periods: [5, 10, 20, 60]
  golden_cross_max_freshness_days: 3
  volume_ratio_threshold: 1.0
  entity_ratio_threshold: 0.40
  close_to_ma5_max_dev: 0.05
  chasing_high_threshold: 0.08
  market_filter: true                    # 市场状态参考信号（000001.SH 20日涨幅）
  market_filter_mode: "block"             # block=非上涨段停止开新仓（2026-10-23 用户决定：动量趋势只在上涨段出手）
                                         # 原 reduce（仓位减半）保留为回退档；历史证据：holdout ON-3%-20d +7.2% vs OFF -7.5%，
                                         # 但样本小/变体脆弱（2%阈值≈无效、60日窗为负 -8.1%）→ 不调参、不加条件
                                         # 前向验证门槛（预注册）：满 ≥20 笔或 1 个月复盘日报「市场闸门」两组条件期望，
                                         # 无差异则回退 reduce（见 docs/决策日志.md 2026-10-23）
                                         # block=非上涨段禁止开仓（旧模式，已判脆弱弃用）

# 风控参数（铁律，不可放松）
risk:
  # P4 个股级波动率目标（2026-09-26）：趋势策略减高波动仓位；反转账本(ir20)自动跳过
  vol_target:
    enabled: true
  # P6 情绪择时（2026-09-27 验证通过但默认关：ir20 过渡期后再评估开启）
  sentiment_filter:
    enabled: false
    fail_threshold: 0.30
    target_vol: 0.35
    window: 20
    min_scale: 0.3
  max_single_position: 0.15
  max_sector_position: 0.40
  stop_loss_warn: -0.03
  stop_loss_exec: -0.05
  stop_loss_force: -0.08
  # 组合层 MDD 硬上限（2026-11-14 从已删除的 scale_in.mdd_limit 迁入）。
  # 每个交易日无条件评估；触及后只阻断新开仓，绝不自动平仓、绝不自动改配置。
  # 评估结果写 outputs/mdd_guard.json，首次触发推一条告警。
  mdd_limit: 0.25
  trailing_profit_pullback: 0.03         # 盈利回撤 3% 离场
  trailing_break_ma: 10                   # 或破 10 日线离场
  max_trades_per_ticker_month: 3
  halt_after_consec_losses: 3
  halt_days: 30
  chasing_high_threshold: 0.08           # 乖离 10 日线 8% 视为追高

# 回测撮合参数
backtest:
  commission: 0.00025                     # 佣金 万 2.5（最低 5 元）
  stamp_tax: 0.0005                       # 卖出印花税 万 5（2023.8 起减半）
  slippage: 0.001                         # 0.1%

# 调度
scheduler:
  daily_scan_cron: "30 16 * * 1-5"        # 周一至周五 16:30（第四轮清单3：Tushare 当日日线 16:00 后完整，15:30 可能取到昨日）
  monthly_review_cron: "0 16 * * L"       # 月末 16:00
  timezone: "Asia/Shanghai"

# 心跳（第四轮清单2：healthchecks.io 缺席告警；url 留空=不 ping）
heartbeat:
  healthchecks_url: ""                    # 例 https://hc-ping.com/<uuid>；后台设"每日 17:30 前未收到完成 ping → 告警"

# 告警（Server酱微信推送；key 为空则仅控制台）
alert:
  serverchan_key: ""
  email:
    enabled: true                         # 总开关（2026-10-11 邮件恢复；auth_code 由 .env 注入）
    smtp_host: "smtp.qq.com"              # 或 smtp.163.com
    smtp_port: 465
    username: "931570981@qq.com"          # 发件邮箱
    auth_code: ""                         # 授权码（非登录密码）；建议放 .env: LIHU_ALERT__EMAIL__AUTH_CODE
    to: ["931570981@qq.com"]              # 收件人列表
    send_daily_digest: true               # 每日综合日报邮件（HTML：持仓/操作/盈亏/风险提示，每日一封）

# 指标自研参数
indicators:
  td_sequential_lookback: 4              # 与 4 根前收盘价比较
  td_sequential_exhaustion: 9            # 9 衰竭点
  divergence_window: 60                  # MACD 背离检测窗口
  divergence_min_window: 36              # 最小窗口（短于此不判背离）

# 智能资金控制（第八轮需求1：仅影响买入尝试的组织方式，不动闸门/铁律/仓位上限）
capital_guard:
  enabled: false                         # 冻结期：关闭（100笔评审后再评估开启）
  min_cash_threshold: 5000               # 可用现金低于此值 → 本轮跳过买入（汇总告警，不逐票刷"资金不足"）
  top_n_enabled: false                   # 冻结期：关闭（评分筛选=策略变更，评审后再开）
  top_n: 5                               # 候选保留数上限

# 看板热力图（第八轮需求2：日级刷新，基于 DuckDB 巡检缓存，无新增数据源依赖）
heatmap:
  enabled: true
  refresh_seconds: 30                    # 前端轮询间隔（秒）；数据随每日巡检更新

# AI 收盘总结（第八轮清单：纯展示层，绝不参与信号/下单/止损决策）
# api_key 不写在本文件——.env 注入 LIHU_AI_SUMMARY__API_KEY=sk-xxx，填好后把 enabled 改 true
ai_summary:
  enabled: true                          # Mimo key 已入 .env（LIHU_AI_SUMMARY__API_KEY）；改回 false 即整体下线
  api_base: "https://api.xiaomimimo.com/v1"   # Mimo 自用 api（OpenAI 兼容）；备选 DeepSeek: https://api.deepseek.com
  model: "mimo-v2.5-pro"                 # 官方 /v1/models 实测 id（小写）；备选 deepseek-chat / qwen-turbo / glm-4-flash
  timeout: 20                            # 秒；超时静默降级（报告无 AI 段，巡检不受影响）
  max_chars: 300                         # 总结长度上限

# 评审自动阻断（P0-3，2026-11-14）：把 USER_GUIDE §5.0「≥50 轮且胜率<45% → 停下检查」
# 变成每次巡检末尾的代码检查（monitor/auto_block.py）。触发时只写
# outputs/auto_block.json + 推一条告警 + 标记「建议冻结新开仓」，
# 绝不自动平仓、绝不自动修改本文件——冻结与调参由人工决策。
review_block_min_rounds: 50             # 预检轮次门槛（已平仓轮次，review_progress 口径）
review_block_min_win_rate: 0.45         # 预检胜率线（低于此值触发阻断告警）

# 影子账本（第十二轮：多池并行积累参考样本）
# 统计纪律：评审进度/胜率以主账本（paper_state.json）为准；影子仅跨池稳健性对照，
# 同期账本间有市场相关性，不得当独立样本合并。
shadow_books:
  - name: "s43"
    seed: 43
  - name: "s44"
    seed: 44
  - name: "wbr25"                       # WBR 周频 ms25 影子（2026-09-29 双轨研究）：2.5%×40只/截面超卖30%/持有20交易日到期
    seed: 45
    strategy: "weekly_band"
  - name: "ir20"                        # P1 通关因子对照腿（2026-09-26）：IntradayReversal 15% 仓位，100 笔后评审
    seed: 42
    strategy: "intraday_reversal"
  - name: "nogate"                      # P1-4 无闸门影子（2026-11-14）：主账本同信号源，仅闸门恒 off
    seed: 42
    strategy: "intraday_reversal"
  - name: "nogate_half"                 # P2 半仓影子（2026-11-14）：主账本同信号源，闸门恒半仓
    seed: 42                            # 与 nogate 的区别：entry_scale 恒 0.5（不是 1.0）
    strategy: "intraday_reversal"

# 影子账本行为配置（P1-4，2026-11-14）：pydantic Settings 未建模该块，
# 由 monitor/scheduler._load_shadow_ledgers() 直读原始 YAML（生效前提：
# shadow_books 里也启用了同名账本）。
# 背景：market_filter_mode=block 期（2026-10-26~11-13，15 天）成交 0 笔，
# "闸门是否误杀机会"永远没有样本 → 用一本闸门恒 off 的影子账本做反事实对照。
# 隔离：独立 paper_state_nogate.json / 独立止损登记 / silent 不发日报，不影响主账本资金与持仓。
shadow_ledgers:
  - name: "nogate"
    enabled: true
    signal_source: "main"               # 与主账本共用同一信号源（同池 seed、同策略）
    market_gate: "off"                  # 闸门恒 off → entry_scale 恒 1.0，不看 market_state
  - name: "nogate_half"                 # P2 半仓影子（2026-11-14）
    enabled: true
    signal_source: "main"               # 同主账本信号源（唯一差异只剩闸门）
    market_gate: "half"                 # 闸门恒半仓 → entry_scale 恒 0.5，不看 market_state
                                        # 别名 "reduce" 在本块内等价 half（注意：与
                                        # strategy.market_filter_mode 的 reduce 无关）
                                        # 独立 paper_state_nogate_half.json，silent 不发日报

# ===================== 第2层：连续风险预算（2026-11-14） =====================
# 把闸门从 0/0.5/1.0 三档改为"按市场状态连续给仓位"（用户风险偏好：收益优先，
# 可接受回撤；MDD 硬上限 25% 见下方 scale_in）。
# **默认关闭**：关闭/缺块时 _gate_scale 与改造前逐位一致（block=0 / reduce=0.5 /
# off=1.0，tests/test_scale_in_risk_budget.py 有逐组合对照测试）。
# 开启后：接管 market_filter_mode 的 block/reduce 语义（系数按本块映射），但
#   - P6 情绪退潮仍独立禁开仓（block）；
#   - strategy.market_filter=false 时闸门整体关闭，本块不生效；
#   - gate=off / gate=half 的影子账本不受影响（各自恒定系数）；
#   - 作用域是"所有 gate=follow 的账本"（主账本 + s43/s44/ir20/wbr25 等对照腿），
#     影子 silent 不告警；若只想主账本生效，请在此开关之外另建独立配置。
gate_risk_budget:
  enabled: false
  uptrend: 1.0        # 上涨
  rangebound: 0.7     # 震荡
  downtrend: 0.4      # 下跌
  unknown: 0.0        # 未知（数据缺失 → 保守不开仓）

# ===================== 分批建仓：已于 2026-11-14 永久移除 =====================
# 移除理由（两条独立证据）：
#   1. 与 docs/交易铁律.md 第4条「绝不向下补仓」直接冲突；
#   2. 真实交割单实证：27.4% 的买入额（155 笔 / ¥1,391,212）发生在
#      "持仓浮亏时加仓"，是用户最大的亏损来源。
# 已物理删除全部代码路径（_load_scale_in / _scale_in_plan / _scale_in_entry /
# _scale_in_candidate / _place_scale_in_buy / 状态文件读写）。**切勿恢复**。
#
# 原先绑在该路径上的「组合层 MDD 25% 硬守卫」已独立出来，改为每个交易日
# 无条件评估（此前只在 scale_in.enabled 时调用，等于永不生效），阈值见 risk.mdd_limit。

