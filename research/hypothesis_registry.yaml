    oos_window:
    - '2026-01-01'
    - '2026-11-10'
  pass_criteria:
    min_oos_improvement_pp: 2.0
    max_mdd_increase_pp: 5.0
    require_significance: true
    decision_rule: OOS 上至少一个基本面因子 |Cliff's delta|>=0.33 且 BH-FDR 校正后 p<0.05，并在「进场涨幅<=2%」子样本内仍能把胜率差拉至 >=10pp。【事后补记】该门槛预注册时只写了数值项，未落文字。
  status: failed
